<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planos de medición Pool Concept</title>
<meta name="theme-color" content="#03A1BE">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#fff;color:#555962;text-align:center;padding:24px}
  img{width:120px;height:120px}
  h1{margin:0;font-size:1.3rem}
  p{margin:0;max-width:320px;line-height:1.5;color:#6A6F78}
  a.btn{background:#03A1BE;color:#fff;text-decoration:none;font-weight:600;padding:14px 26px;border-radius:12px}
</style>
</head>
<body>
  <img src="icon-512.png" alt="">
  <h1>Planos de medición Pool Concept</h1>
  <p id="msg">Para instalarla, abre el menú ⋮ de Chrome y pulsa «Instalar aplicación».</p>
  <a class="btn" id="go" href="#">Abrir Planos</a>
<script>
  // ⬇️ PEGA AQUÍ LA URL DE TU APLICACIÓN WEB DE APPS SCRIPT (la que termina en /exec), entre las comillas
  var URL_APP = 'PEGA_AQUI_TU_URL/exec';

  document.getElementById('go').href = URL_APP;
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  var instalada = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  if (instalada) {
    document.getElementById('msg').textContent = 'Abriendo…';
    location.replace(URL_APP);
  }
</script>
</body>
</html>
